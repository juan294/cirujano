name: Matrix
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
permissions: read-all
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - run: node --version && pnpm test
