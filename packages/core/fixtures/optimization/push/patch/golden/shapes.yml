name: Shapes
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
permissions: read-all
jobs:
  cirujano_validated_push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      validated: ${{ steps.classify.outputs.validated }}
    steps:
      - name: Check whether this push was already validated by its PR (Cirujano)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'CIRUJANO_CLASSIFIER'
          __CLASSIFIER_SCRIPT__
          CIRUJANO_CLASSIFIER
  # Lint has no dependencies.
  lint:
    needs: [cirujano_validated_push]
    if: "${{ !cancelled() && (needs.cirujano_validated_push.result != 'success' || needs.cirujano_validated_push.outputs.validated != 'true') }}"
    runs-on: ubuntu-latest
    steps:
      - run: pnpm lint
  unit:
    needs: [lint, cirujano_validated_push]
    if: "${{ !cancelled() && needs.lint.result == 'success' && (needs.cirujano_validated_push.result != 'success' || needs.cirujano_validated_push.outputs.validated != 'true') && (github.repository_owner == 'public-example') }}"
    runs-on: ubuntu-latest
    steps:
      - run: pnpm test
  package:
    if: "${{ !cancelled() && needs.lint.result == 'success' && needs.unit.result == 'success' && (needs.cirujano_validated_push.result != 'success' || needs.cirujano_validated_push.outputs.validated != 'true') && (github.repository != '') }}"
    needs: [lint, unit, cirujano_validated_push]
    runs-on: ubuntu-latest
    steps:
      - run: pnpm pack
