name: Matrix
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
permissions: read-all
jobs:
  cirujano_validated_push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      validated: ${{ steps.classify.outputs.validated }}
    steps:
      - name: Check whether this push was already validated by its PR (Cirujano)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'CIRUJANO_CLASSIFIER'
          __CLASSIFIER_SCRIPT__
          CIRUJANO_CLASSIFIER
  test:
    needs: [cirujano_validated_push]
    if: "${{ !cancelled() && (needs.cirujano_validated_push.result != 'success' || needs.cirujano_validated_push.outputs.validated != 'true') }}"
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - run: node --version && pnpm test
